<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<title>スタログ</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="スタログ">
<meta name="description" content="勉強中に2秒撮るだけ。科目と時間を記録して、友達と1日を見せ合える勉強ログ。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="スタログ">
<meta property="og:title" content="スタログ">
<meta property="og:description" content="勉強中に2秒撮るだけ。みんなの1日を、続けて再生。">
<meta property="og:image" content="https://yoshitarok.github.io/sutalog/ogp2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://yoshitarok.github.io/sutalog/ogp2.png">
<style>
:root{--bg:#0a0b0e;--card:#14161b;--card2:#1b1e25;--ink:#f3f5f8;--sub:#8a92a0;--main:#c6ff3d;--main-ink:#0a0b0e;--accent:#c6ff3d;--line:#262a33;--err:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);background-image:radial-gradient(120% 60% at 100% 0%,rgba(198,255,61,.10),transparent 60%),radial-gradient(90% 50% at 0% 0%,rgba(80,120,255,.10),transparent 60%);background-attachment:fixed;color:var(--ink);padding:0 16px calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{padding:calc(16px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:24px;white-space:nowrap;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
h1::before{content:"";width:12px;height:12px;border-radius:99px;background:var(--main);box-shadow:0 0 14px var(--main)}
h1::after{content:"STUDY LOG";font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 8px;white-space:nowrap}
header .me{margin-left:auto;font-size:13px;color:var(--sub);display:flex;gap:10px;align-items:center;white-space:nowrap;min-width:0}
header .me span{overflow:hidden;text-overflow:ellipsis;max-width:7em}
@media (max-width:430px){h1::after{display:none}}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border-radius:22px;padding:16px;margin:14px 0;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
h2{font-size:17px;font-weight:800;margin:0 0 12px;letter-spacing:.01em}
button{font:inherit;cursor:pointer;transition:transform .12s,background .2s,color .2s,border-color .2s}
button:active{transform:scale(.97)}
input,select{font:inherit;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#0f1115;color:var(--ink);width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#5c6370}
input:focus,select:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(198,255,61,.18)}
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);margin:14px 0 6px}
.big{width:100%;margin-top:14px;padding:16px;border:0;border-radius:18px;background:var(--accent);color:var(--main-ink);font-size:17px;font-weight:800;letter-spacing:.03em;box-shadow:0 8px 24px rgba(198,255,61,.25)}
.big.main{background:var(--main);color:var(--main-ink)}
.big:disabled{opacity:.35;box-shadow:none}
#rec{display:flex;align-items:center;justify-content:center;gap:10px}
#rec::before{content:"";width:14px;height:14px;border-radius:99px;background:#ff3b3b;box-shadow:0 0 0 3px rgba(10,11,14,.25)}
.ghost{border:1px solid var(--line);background:#0f1115;border-radius:12px;padding:9px 14px;color:var(--ink);font-weight:600}
.ghost:disabled{opacity:.3}
.link{border:0;background:none;color:var(--main);text-decoration:none;padding:0;font-weight:600}
.msg{color:var(--err);font-size:13px;margin-top:10px;min-height:1em;white-space:pre-wrap}
.ok{color:var(--main)}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.row input{flex:1;width:auto}
.seg{display:flex;background:#0f1115;border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;color:var(--sub);font-weight:700}
.seg button.on{background:var(--main);color:var(--main-ink)}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;width:100%;border:1px solid var(--line)}
.cam::after{content:"";position:absolute;inset:12px;border-radius:10px;pointer-events:none;background:linear-gradient(var(--main),var(--main)) top left/18px 2px,linear-gradient(var(--main),var(--main)) top left/2px 18px,linear-gradient(var(--main),var(--main)) top right/18px 2px,linear-gradient(var(--main),var(--main)) top right/2px 18px,linear-gradient(var(--main),var(--main)) bottom left/18px 2px,linear-gradient(var(--main),var(--main)) bottom left/2px 18px,linear-gradient(var(--main),var(--main)) bottom right/18px 2px,linear-gradient(var(--main),var(--main)) bottom right/2px 18px;background-repeat:no-repeat;opacity:.7}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:96px;font-weight:800;color:var(--main);text-shadow:0 0 30px rgba(198,255,61,.6)}
.cam .rec{position:absolute;top:18px;left:18px;background:#ff3b3b;color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;display:none;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#0f1115;border-radius:99px;padding:9px 16px;font-size:15px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--main);color:var(--main-ink);border-color:var(--main);box-shadow:0 0 16px rgba(198,255,61,.35)}
.banner{display:none;background:rgba(255,190,60,.12);border:1px solid rgba(255,190,60,.4);color:#ffd27a;border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:17px;font-weight:800}
.nav .ghost{width:40px;height:40px;padding:0;border-radius:99px}
.totals{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.tot{background:#0f1115;border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:14px;font-weight:600}
.tot.main{flex-basis:100%;background:none;border:0;padding:0 0 4px;font-size:30px;font-weight:800;color:var(--main);letter-spacing:.01em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.th{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;border:1px solid var(--line)}
.th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.th .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:11px;font-weight:600;padding:14px 7px 6px;line-height:1.35}
.th .x{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:99px;width:26px;height:26px;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pwrap{position:relative;margin-top:14px}
.pwrap video{width:100%;border-radius:18px;background:#000;max-height:60vh;display:block;border:1px solid var(--line)}
.pwrap .ov{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.empty{color:var(--sub);font-size:14px;padding:10px 0}
.note{font-size:12px;color:var(--sub);margin-top:12px}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#0f1115;color:var(--ink);text-align:left;width:100%}
.gitem.on{border-color:var(--main);box-shadow:0 0 0 1px var(--main) inset,0 0 18px rgba(198,255,61,.15)}
.gitem b{flex:1}
.code{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:4px;font-weight:800;color:var(--main);text-shadow:0 0 16px rgba(198,255,61,.35)}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mem{font-size:13px;background:#0f1115;border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(20,22,27,.78);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:22px;display:flex;padding:6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tabs button{flex:1;border:0;background:none;padding:8px 0;border-radius:16px;color:var(--sub);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--main-ink);background:var(--main)}
/* 時間の入力欄 */
.tm input{flex:0 0 76px;width:76px;text-align:center;font-size:20px;font-weight:800;padding:10px 6px}
.tm span{font-size:15px;color:var(--sub);font-weight:700}
#mPresets .chip{padding:7px 13px;font-size:14px}
/* いま勉強中 */
.live-dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:#ff3b3b;margin-right:8px;vertical-align:middle;box-shadow:0 0 0 0 rgba(255,59,59,.6);animation:livepulse 1.6s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.6)}70%{box-shadow:0 0 0 8px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.live-banner{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,59,59,.35);background:rgba(255,59,59,.08);color:var(--ink);font-size:14px;font-weight:700;text-align:left}
.live-banner b{color:var(--main)}
.live-banner .go{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.live-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.live-row:first-child{border-top:0}
.live-row b{font-size:15px}
.live-row .sub{color:var(--sub);font-size:13px;margin-left:auto;white-space:nowrap}
.live-row .subj{background:var(--main);color:var(--main-ink);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}
/* ナイス */
.th .nice{position:absolute;top:5px;left:5px;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:99px;height:26px;padding:0 8px;font-size:12px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.th .nice.on{background:var(--main);color:var(--main-ink);border-color:var(--main)}
.th span.nice{pointer-events:none}
/* みんなで目標 */
.goal{background:#0f1115;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px}
.goal-top{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--sub);font-weight:700}
.goal-top b{color:var(--ink);font-size:15px}
.goal-top .link{margin-left:auto;font-size:13px}
.goal-bar{height:12px;border-radius:99px;background:#1b1e25;margin-top:10px;overflow:hidden}
.goal-bar i{display:block;height:100%;border-radius:99px;background:var(--main);box-shadow:0 0 12px rgba(198,255,61,.5);transition:width .6s}
.goal-msg{font-size:13px;margin-top:8px;color:var(--sub);font-weight:600}
.goal-msg b{color:var(--main)}
.goal.done{border-color:var(--main);box-shadow:0 0 18px rgba(198,255,61,.18)}
.goal-edit{display:flex;gap:8px;align-items:center;margin-top:10px}
.goal-edit input{width:90px;flex:0 0 90px;text-align:center;font-weight:800}
label.sw{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
label.sw input{width:20px;height:20px;accent-color:var(--main)}
</style>
</head>
<body>
<header>
  <h1>スタログ</h1>
  <div class="me hidden" id="meBox"><span id="meName"></span><button class="link" id="logout">ログアウト</button></div>
</header>

<!-- 設定がまだのとき -->
<section class="card hidden" id="setupView">
  <h2>最初の設定がまだです</h2>
  <p style="font-size:14px">index.html の中の <b>SUPABASE_URL</b> と <b>SUPABASE_KEY</b> に、Supabase の値を入れてください。</p>
</section>

<!-- ログイン -->
<section class="card hidden" id="authView">
  <div class="seg"><button type="button" id="tLogin" class="on">ログイン</button><button type="button" id="tSignup">新規登録</button></div>
  <!-- form にしておくと、iPhone のパスワード保存・自動入力が使える -->
  <form id="authForm" method="post" action="#" autocomplete="on">
    <div id="nameWrap" class="hidden">
      <label class="f" for="aName">表示名(グループのみんなに見えます)</label>
      <input id="aName" name="nickname" maxlength="20" placeholder="例:よしたろう" autocomplete="nickname">
    </div>
    <label class="f" for="aEmail">メールアドレス</label>
    <input id="aEmail" name="email" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label class="f" for="aPass">パスワード(6文字以上)</label>
    <input id="aPass" name="password" type="password" autocomplete="current-password" minlength="6" required>
    <label class="sw" style="margin-top:10px"><input type="checkbox" id="aShow">パスワードを表示</label>
    <button type="submit" class="big main" id="aGo">ログイン</button>
  </form>
  <div class="msg" id="aMsg"></div>
</section>

<main id="appView" class="hidden">

  <!-- 撮る -->
  <div id="pShoot">
    <button type="button" class="live-banner hidden" id="liveShoot"></button>
    <section class="card">
      <h2>いま勉強していることを撮る</h2>
      <div class="cam">
        <video id="cam" playsinline muted autoplay></video>
        <div class="rec" id="recMark">● 撮影中</div>
        <div class="count" id="count"></div>
      </div>
      <div class="row">
        <button class="ghost" id="startCam">カメラを開く</button>
        <button class="ghost" id="flip">カメラ切替</button>
      </div>
      <div class="msg" id="camMsg"></div>
      <div style="margin-top:6px" class="chips" id="subjects"></div>
      <div class="row">
        <input id="newSub" placeholder="科目を追加" maxlength="12">
        <button class="ghost" id="addSub">追加</button>
      </div>
      <label class="f" for="mH">勉強した時間</label>
      <div class="chips" id="mPresets"></div>
      <div class="row tm">
        <input id="mH" type="number" inputmode="numeric" min="0" max="5" step="1" value="1" aria-label="時間"><span>時間</span>
        <input id="mM" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" aria-label="分"><span>分</span>
        <input id="minutes" type="hidden" value="60">
      </div>
      <button class="big" id="rec" disabled>2秒撮る</button>
      <div class="msg ok" id="saveMsg"></div>
      <div class="banner" id="banner">⏰ 1時間たちました。いまの勉強を撮りましょう</div>
      <div class="row"><label class="sw"><input type="checkbox" id="remind">このページを開いている間、1時間ごとに知らせる</label></div>
    </section>
  </div>

  <!-- じぶん -->
  <div id="pMine" class="hidden">
    <section class="card">
      <div class="nav"><button class="ghost" id="mPrev">◀</button><b id="mDay"></b><button class="ghost" id="mNext">▶</button></div>
      <div id="mBody"></div>
    </section>
  </div>

  <!-- グループ -->
  <div id="pGroup" class="hidden">
    <section class="card">
      <h2>わたしのグループ</h2>
      <div class="glist" id="gList"></div>
      <div class="empty hidden" id="gEmpty">まだグループに入っていません</div>
      <div class="row">
        <input id="joinCode" placeholder="招待コード(6文字)" maxlength="6" style="text-transform:uppercase">
        <button class="ghost" id="joinBtn">参加</button>
      </div>
      <div class="row">
        <input id="newGroup" placeholder="新しいグループ名" maxlength="20">
        <button class="ghost" id="createBtn">作る</button>
      </div>
      <div class="msg" id="gMsg"></div>
    </section>

    <section class="card hidden" id="gDetail">
      <h2 id="gName"></h2>
      <div style="font-size:13px;color:var(--sub)">招待コード</div>
      <div class="row" style="margin-top:2px"><span class="code" id="gCode"></span><button class="ghost" id="shareBtn">友達に送る</button></div>
      <div class="members" id="gMembers"></div>
      <div class="row"><button class="link" id="leaveBtn" style="color:var(--err)">このグループを抜ける</button></div>
    </section>

    <section class="card hidden" id="gLive">
      <h2><span class="live-dot"></span>いま勉強中</h2>
      <div id="gLiveBody"></div>
      <div class="note">1時間以内に撮った人が出ます</div>
    </section>

    <section class="card hidden" id="gDay">
      <div class="nav"><button class="ghost" id="gPrev">◀</button><b id="gDayLabel"></b><button class="ghost" id="gNext">▶</button></div>
      <div id="gBody"></div>
    </section>
  </div>
</main>

<nav class="tabs hidden" id="tabs">
  <button data-p="pShoot" class="on"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>撮る</button>
  <button data-p="pMine"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>じぶん</button>
  <button data-p="pGroup"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="8" r="2.5"/><path d="M16 13.5c3 0 5 2 5 4.5"/></svg></span>グループ</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js"></script>
<script>
/* ======== ここに Supabase の値を入れる ======== */
const SUPABASE_URL = 'https://wsrfoxuckcacfzkaemdr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Mlr40hs-VC5SX5nwarcDWA_k79Kj-PP';
/* ============================================ */

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const show=(el,on)=>el.classList.toggle('hidden',!on);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- 日付(朝4時区切り) ---------- */
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayKey(ts){return keyOf(new Date(ts-4*3600e3))}
function keyToDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function shiftKey(k,n){const d=keyToDate(k);d.setDate(d.getDate()+n);return keyOf(d)}
function labelOf(k){const d=keyToDate(k);return `${d.getMonth()+1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`+(k===dayKey(Date.now())?' 今日':'')}
const fmtTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtMin=m=>m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`;

/* ---------- 起動 ---------- */
if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase){show($('#setupView'),true);throw new Error('setup')}
// ログイン状態をこの端末に保存し、期限が切れる前に自動で更新する(自分でログアウトするまで続く)
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let me=null,myName='';

const joinFromUrl=new URLSearchParams(location.search).get('join');

sb.auth.onAuthStateChange((_e,session)=>{setTimeout(()=>onSession(session),0)});
let started=false;
async function onSession(session){
  if(!session){
    me=null;started=false;
    show($('#authView'),true);show($('#appView'),false);show($('#tabs'),false);show($('#meBox'),false);
    return;
  }
  if(started&&me&&me.id===session.user.id)return;
  me=session.user;started=true;
  await ensureProfile();
  $('#meName').textContent=myName;
  show($('#authView'),false);show($('#appView'),true);show($('#tabs'),true);show($('#meBox'),true);
  renderShootLive();
  if(joinFromUrl){$('#joinCode').value=joinFromUrl.toUpperCase();openTab('pGroup')}
}
async function ensureProfile(){
  const {data}=await sb.from('profiles').select('name').eq('id',me.id).maybeSingle();
  if(data){myName=data.name;return}
  myName=(me.user_metadata&&me.user_metadata.name)||me.email.split('@')[0];
  await sb.from('profiles').insert({id:me.id,name:myName});
}

/* ---------- ログイン・登録 ---------- */
let mode='login';
function setMode(m){
  mode=m;
  $('#tLogin').classList.toggle('on',m==='login');$('#tSignup').classList.toggle('on',m==='signup');
  show($('#nameWrap'),m==='signup');
  $('#aGo').textContent=m==='login'?'ログイン':'登録する';
  $('#aPass').autocomplete=m==='login'?'current-password':'new-password';
  $('#aMsg').textContent='';
}
$('#tLogin').onclick=()=>setMode('login');
$('#tSignup').onclick=()=>setMode('signup');
$('#aShow').onchange=()=>{$('#aPass').type=$('#aShow').checked?'text':'password'};
$('#authForm').onsubmit=async e=>{
  e.preventDefault();
  // 表示中のままだと iPhone がパスワード保存を出さないので、送る前に隠す
  $('#aShow').checked=false;$('#aPass').type='password';
  const email=$('#aEmail').value.trim(),password=$('#aPass').value,name=$('#aName').value.trim();
  const m=$('#aMsg');m.className='msg';m.textContent='';
  if(!email||!password){m.textContent='メールアドレスとパスワードを入れてください';return}
  if(mode==='signup'&&!name){m.textContent='表示名を入れてください';return}
  $('#aGo').disabled=true;
  try{
    if(mode==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)m.textContent=/confirm/i.test(error.message)?'メールの確認がまだです。届いたメールのリンクを押してください':'メールアドレスかパスワードが違います';
    }else{
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.href.split('#')[0]}});
      if(error)m.textContent=/registered/i.test(error.message)?'このメールアドレスは登録済みです':/password/i.test(error.message)?'パスワードは6文字以上にしてください':'登録できませんでした:'+error.message;
      else if(!data.session){m.className='msg ok';m.textContent='確認メールを送りました。メールのリンクを押してから、ログインしてください'}
    }
  }finally{$('#aGo').disabled=false}
};
$('#logout').onclick=()=>sb.auth.signOut();

let stream=null,facing='environment',busy=false;
function updateRecBtn(){$('#rec').disabled=!(stream&&subject&&Number($('#minutes').value)>0)||busy}

/* ---------- 勉強した時間(1分〜5時間で自由に) ---------- */
const PRESETS=[15,30,45,60,90,120,180];
function setMinutes(total,fromInput){
  total=Math.max(0,Math.min(300,Math.round(total)||0));
  $('#minutes').value=total;lsSet('sl_minutes',total);
  if(!fromInput){$('#mH').value=Math.floor(total/60);$('#mM').value=total%60}
  document.querySelectorAll('#mPresets .chip').forEach(b=>b.classList.toggle('on',Number(b.dataset.m)===total));
  updateRecBtn();
}
PRESETS.forEach(m=>{
  const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.m=m;b.textContent=fmtMin(m);
  b.onclick=()=>setMinutes(m);$('#mPresets').appendChild(b);
});
['#mH','#mM'].forEach(q=>{
  $(q).oninput=()=>setMinutes((Number($('#mH').value)||0)*60+(Number($('#mM').value)||0),true);
  $(q).onblur=()=>setMinutes(Number($('#minutes').value));
});
setMinutes(lsGet('sl_minutes',60));
async function startCam(){
  $('#camMsg').textContent='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#camMsg').textContent='このブラウザではカメラが使えません';return}
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:720},height:{ideal:960}},audio:false});
    $('#cam').srcObject=stream;$('#startCam').classList.add('hidden');
  }catch(e){stream=null;$('#camMsg').textContent='カメラを使えませんでした。ブラウザのカメラ許可を確認してください'}
  updateRecBtn();
}
$('#startCam').onclick=startCam;
$('#flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};

function record(){
  if(!stream||!subject||busy)return;
  if(!window.MediaRecorder){$('#camMsg').textContent='このブラウザは録画に対応していません';return}
  busy=true;updateRecBtn();$('#saveMsg').textContent='';
  const mt=['video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  let mr;
  try{mr=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:1500000}:undefined)}
  catch(e){busy=false;updateRecBtn();$('#camMsg').textContent='録画を始められませんでした';return}
  const chunks=[],ts=Date.now();
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{
    $('#recMark').style.display='none';$('#count').style.display='none';
    const type=(mr.mimeType||mt||'video/webm').split(';')[0];
    const blob=new Blob(chunks,{type});
    $('#saveMsg').textContent='アップロード中…';
    const err=await uploadClip(blob,type,ts);
    $('#saveMsg').className=err?'msg':'msg ok';
    $('#saveMsg').textContent=err||`保存しました(${subject} ${fmtMin(Number($('#minutes').value))})`;
    if(!err){$('#banner').style.display='none';scheduleRemind();renderShootLive()}
    busy=false;updateRecBtn();
  };
  mr.start();
  $('#recMark').style.display='block';
  const c=$('#count');c.style.display='flex';c.textContent='2';
  setTimeout(()=>{c.textContent='1'},1000);
  setTimeout(()=>{if(mr.state!=='inactive')mr.stop()},2000);
}
$('#rec').onclick=record;

async function uploadClip(blob,type,ts){
  const ext=type.includes('mp4')?'mp4':'webm';
  const path=`${me.id}/${ts}.${ext}`;
  const up=await sb.storage.from('clips').upload(path,blob,{contentType:type,upsert:false});
  if(up.error)return '動画を送れませんでした。電波を確認してもう一度撮ってください';
  const ins=await sb.from('clips').insert({user_id:me.id,ts:new Date(ts).toISOString(),day_key:dayKey(ts),subject,minutes:Number($('#minutes').value),path});
  if(ins.error){await sb.storage.from('clips').remove([path]);return /check/i.test(ins.error.message)?'この時間では保存できませんでした(Supabaseの設定を確認してください)':'記録を保存できませんでした'}
  return '';
}

/* ---------- 1日分の表示(じぶん・グループ共通) ---------- */
async function fetchDay(key,userIds){
  const {data,error}=await sb.from('clips').select('id,user_id,ts,subject,minutes,path').eq('day_key',key).in('user_id',userIds).order('ts');
  if(error||!data)return [];
  if(data.length){
    const {data:signed}=await sb.storage.from('clips').createSignedUrls(data.map(c=>c.path),3600);
    const map={};(signed||[]).forEach(s=>{if(s.signedUrl)map[s.path]=s.signedUrl});
    data.forEach(c=>c.url=map[c.path]);
  }
  return data.filter(c=>c.url);
}

function renderDay(box,clips,names){
  box.innerHTML='';
  const isGroup=!!names;
  const total=clips.reduce((s,c)=>s+c.minutes,0);
  const by={};clips.forEach(c=>{const k=isGroup?(names[c.user_id]||'?'):c.subject;by[k]=(by[k]||0)+c.minutes});
  const t=document.createElement('div');t.className='totals';
  const m=document.createElement('div');m.className='tot main';m.textContent=(isGroup?'みんなで ':'合計 ')+fmtMin(total);t.appendChild(m);
  Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{const d=document.createElement('div');d.className='tot';d.textContent=`${k} ${fmtMin(v)}`;t.appendChild(d)});
  box.appendChild(t);
  if(isGroup&&curGroup&&curGroup.goal_minutes!=null)box.appendChild(goalBox(total));
  if(!clips.length){const e=document.createElement('div');e.className='empty';e.textContent='この日の記録はまだありません';box.appendChild(e);return}

  const play=document.createElement('button');play.className='big main';play.style.marginTop='0';
  play.textContent=isGroup?'みんなの1日を続けて再生':'この日を続けて再生';
  const pw=document.createElement('div');pw.className='pwrap hidden';
  const v=document.createElement('video');v.playsInline=true;v.muted=true;v.controls=true;
  const ov=document.createElement('div');ov.className='ov';
  pw.append(v,ov);
  play.onclick=()=>{
    show(pw,true);let i=0;
    const next=()=>{
      if(i>=clips.length){ov.textContent='おわり';return}
      const c=clips[i];v.src=c.url;
      ov.textContent=`${i+1}/${clips.length}  ${fmtTime(c.ts)}  ${isGroup?(names[c.user_id]||'')+' ・ ':''}${c.subject}`;
      v.play().catch(()=>{});
    };
    v.onended=()=>{i++;next()};
    v.onerror=()=>{i++;next()};
    next();pw.scrollIntoView({behavior:'smooth',block:'center'});
  };
  box.append(play,pw);

  const g=document.createElement('div');g.className='grid';
  clips.forEach(c=>{
    const el=document.createElement('div');el.className='th';
    const vv=document.createElement('video');vv.src=c.url+'#t=0.1';vv.preload='metadata';vv.muted=true;vv.playsInline=true;
    const cap=document.createElement('div');cap.className='cap';
    cap.textContent=`${fmtTime(c.ts)} ${c.subject}`+(isGroup?`\n${names[c.user_id]||''}`:'');
    cap.style.whiteSpace='pre-line';
    el.append(vv,cap);
    const nice=document.createElement(c.user_id===me.id?'span':'button');nice.className='nice hidden';nice.dataset.id=c.id;
    if(c.user_id!==me.id){nice.type='button';nice.setAttribute('aria-label','ナイス');nice.onclick=()=>toggleNice(c.id,nice)}
    el.appendChild(nice);
    if(c.user_id===me.id){
      const x=document.createElement('button');x.className='x';x.textContent='×';
      x.onclick=async()=>{
        if(!confirm('この2秒を消しますか?'))return;
        await sb.from('clips').delete().eq('id',c.id);
        await sb.storage.from('clips').remove([c.path]);
        isGroup?renderGroupDay():renderMine();
      };
      el.appendChild(x);
    }
    g.appendChild(el);
  });
  box.appendChild(g);
  loadNice(clips,box,t,isGroup);
  const n=document.createElement('div');n.className='note';n.textContent='1日は朝4時から翌朝4時まで。×は自分の動画だけ消せます。';box.appendChild(n);
}

/* ---------- ナイス(👏) ---------- */
let niceMap={};   // clip_id → Set(user_id)
let niceReady=false;
function paintNice(btn){
  const set=niceMap[btn.dataset.id]||new Set();
  const mine=set.has(me.id),n=set.size,own=btn.tagName==='SPAN';
  btn.classList.toggle('on',mine);
  btn.textContent='👏'+(n?' '+n:'');
  show(btn,!own||n>0);   // 自分の動画は、もらったときだけ数を出す
}
async function loadNice(clips,box,totals,isGroup){
  if(!clips.length)return;
  const {data,error}=await sb.from('reactions').select('clip_id,user_id').in('clip_id',clips.map(c=>c.id));
  if(error)return;   // まだ Supabase に設定が無いときは何も出さない
  niceReady=true;
  clips.forEach(c=>niceMap[c.id]=new Set());
  data.forEach(r=>(niceMap[r.clip_id]||(niceMap[r.clip_id]=new Set())).add(r.user_id));
  box.querySelectorAll('.nice').forEach(paintNice);
  if(!isGroup){
    const got=clips.reduce((s,c)=>s+(niceMap[c.id]?niceMap[c.id].size:0),0);
    if(got){const d=document.createElement('div');d.className='tot';d.textContent=`👏 もらった ${got}`;totals.appendChild(d)}
  }
}
async function toggleNice(id,btn){
  const set=niceMap[id]||(niceMap[id]=new Set());
  const had=set.has(me.id);
  had?set.delete(me.id):set.add(me.id);paintNice(btn);   // 先に見た目を変える
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  const {error}=had
    ?await sb.from('reactions').delete().eq('clip_id',id).eq('user_id',me.id)
    :await sb.from('reactions').insert({clip_id:id});
  if(error){had?set.add(me.id):set.delete(me.id);paintNice(btn)}
}

/* ---------- みんなで目標 ---------- */
function goalBox(total){
  const goal=curGroup.goal_minutes,pct=Math.min(100,Math.round(total/goal*100));
  const box=document.createElement('div');box.className='goal'+(total>=goal?' done':'');
  const top=document.createElement('div');top.className='goal-top';
  const lb=document.createElement('span');lb.textContent='みんなで目標';
  const v=document.createElement('b');v.textContent=`${fmtMin(total)} / ${fmtMin(goal)}`;
  const ed=document.createElement('button');ed.type='button';ed.className='link';ed.textContent='変える';
  top.append(lb,v,ed);
  const bar=document.createElement('div');bar.className='goal-bar';const fill=document.createElement('i');fill.style.width=pct+'%';bar.appendChild(fill);
  const msg=document.createElement('div');msg.className='goal-msg';
  msg.innerHTML=total>=goal?'<b>目標達成!</b> みんなおつかれさま':`あと <b>${fmtMin(goal-total)}</b>。ひとり30分でも大きな一歩`;
  box.append(top,bar,msg);
  ed.onclick=()=>{
    if(box.querySelector('.goal-edit'))return;
    const row=document.createElement('div');row.className='goal-edit';
    const inp=document.createElement('input');inp.type='number';inp.inputMode='decimal';inp.min='0.5';inp.max='100';inp.step='0.5';inp.value=goal/60;inp.setAttribute('aria-label','目標(時間)');
    const u=document.createElement('span');u.textContent='時間';u.style.cssText='font-size:14px;color:var(--sub);font-weight:700';
    const ok=document.createElement('button');ok.type='button';ok.className='ghost';ok.textContent='保存';
    row.append(inp,u,ok);box.appendChild(row);inp.focus();
    ok.onclick=async()=>{
      const m=Math.round(Number(inp.value)*60);
      if(!(m>=30&&m<=6000)){msg.textContent='30分〜100時間で入れてください';return}
      ok.disabled=true;
      const {error}=await sb.rpc('set_group_goal',{gid:curGroup.id,minutes:m});
      ok.disabled=false;
      if(error){msg.textContent='変えられませんでした。もう一度試してください';return}
      curGroup.goal_minutes=m;const g=groups.find(x=>x.id===curGroup.id);if(g)g.goal_minutes=m;
      renderGroupDay();
    };
  };
  return box;
}

/* ---------- いま勉強中(1時間以内に撮った人) ---------- */
const LIVE_MIN=60;
async function fetchLive(userIds){
  if(!userIds.length)return [];
  const since=new Date(Date.now()-LIVE_MIN*60e3).toISOString();
  const {data}=await sb.from('clips').select('user_id,ts,subject').in('user_id',userIds).gte('ts',since).order('ts',{ascending:false});
  const seen=new Set();
  return (data||[]).filter(c=>!seen.has(c.user_id)&&seen.add(c.user_id));
}
const agoText=ts=>{const m=Math.max(0,Math.round((Date.now()-new Date(ts))/60e3));return m<1?'たった今':`${m}分前`};
async function renderGroupLive(){
  if(!curGroup)return;
  const gid=curGroup.id,list=await fetchLive(members);
  if(!curGroup||gid!==curGroup.id)return;
  const box=$('#gLiveBody');box.innerHTML='';
  show($('#gLive'),true);
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='いまは誰も記録していません。最初の1本を撮ろう';box.appendChild(e);return}
  list.forEach(c=>{
    const r=document.createElement('div');r.className='live-row';
    const n=document.createElement('b');n.textContent=(names[c.user_id]||'?')+(c.user_id===me.id?'(自分)':'');
    const sj=document.createElement('span');sj.className='subj';sj.textContent=c.subject;
    const a=document.createElement('span');a.className='sub';a.textContent=agoText(c.ts);
    r.append(n,sj,a);box.appendChild(r);
  });
}
// 撮るタブ:選んでいるグループで、自分以外に勉強中の人がいたら知らせる
async function renderShootLive(){
  const el=$('#liveShoot');
  const {data:gs}=await sb.from('groups').select('id,name').order('created_at');
  if(!gs||!gs.length){show(el,false);return}
  const saved=lsGet('sl_group',null),g=gs.find(x=>x.id===saved)||gs[0];
  const {data:mem}=await sb.from('group_members').select('user_id').eq('group_id',g.id);
  const ids=(mem||[]).map(m=>m.user_id).filter(id=>id!==me.id);
  const list=await fetchLive(ids);
  if(!list.length){show(el,false);return}
  const {data:profs}=await sb.from('profiles').select('id,name').in('id',list.map(c=>c.user_id));
  const nm={};(profs||[]).forEach(p=>nm[p.id]=p.name);
  const who=list.slice(0,3).map(c=>nm[c.user_id]||'?').join('・')+(list.length>3?` ほか${list.length-3}人`:'');
  el.innerHTML='';
  const dot=document.createElement('span');dot.className='live-dot';
  const tx=document.createElement('span');const b=document.createElement('b');b.textContent=who;tx.append(b,document.createTextNode(' が今勉強中'));
  const go=document.createElement('span');go.className='go';go.textContent=g.name+' ›';
  el.append(dot,tx,go);show(el,true);
}
$('#liveShoot').onclick=()=>openTab('pGroup');
setInterval(()=>{
  if(!me||document.hidden)return;
  if(!$('#pShoot').classList.contains('hidden'))renderShootLive();
  if(!$('#pGroup').classList.contains('hidden'))renderGroupLive();
},60e3);

/* ---------- グループ ---------- */
let groups=[],curGroup=null,members=[],names={},gKey=dayKey(Date.now());
function gmsg(t,ok){$('#gMsg').className=ok?'msg ok':'msg';$('#gMsg').textContent=t||''}
async function loadGroups(){
  // goal_minutes は Supabase に設定を足すまで無いので、無ければ従来どおり読む
  let {data,error}=await sb.from('groups').select('id,name,code,created_at,goal_minutes').order('created_at');
  if(error)({data}=await sb.from('groups').select('id,name,code,created_at').order('created_at'));
  groups=data||[];
  if(curGroup&&!groups.find(g=>g.id===curGroup.id))curGroup=null;
  if(!curGroup){const saved=lsGet('sl_group',null);curGroup=groups.find(g=>g.id===saved)||groups[0]||null}
  renderGroupList();
  if(curGroup)selectGroup(curGroup);else{show($('#gDetail'),false);show($('#gDay'),false);show($('#gLive'),false)}
}
function renderGroupList(){
  const box=$('#gList');box.innerHTML='';
  show($('#gEmpty'),!groups.length);
  groups.forEach(g=>{
    const b=document.createElement('button');b.className='gitem'+(curGroup&&curGroup.id===g.id?' on':'');
    const n=document.createElement('b');n.textContent=g.name;
    const s=document.createElement('span');s.style.cssText='font-size:12px;color:var(--sub)';s.textContent='見る ›';
    b.append(n,s);b.onclick=()=>selectGroup(g);box.appendChild(b);
  });
}
async function selectGroup(g){
  curGroup=g;lsSet('sl_group',g.id);renderGroupList();
  $('#gName').textContent=g.name;$('#gCode').textContent=g.code;
  show($('#gDetail'),true);show($('#gDay'),true);
  const {data:mem}=await sb.from('group_members').select('user_id').eq('group_id',g.id);
  members=(mem||[]).map(m=>m.user_id);
  const {data:profs}=await sb.from('profiles').select('id,name').in('id',members.length?members:[me.id]);
  names={};(profs||[]).forEach(p=>names[p.id]=p.name);
  const mb=$('#gMembers');mb.innerHTML='';
  members.forEach(id=>{const s=document.createElement('span');s.className='mem';s.textContent=(names[id]||'?')+(id===me.id?'(自分)':'');mb.appendChild(s)});
  renderGroupDay();renderGroupLive();
}
async function renderGroupDay(){
  if(!curGroup)return;
  $('#gDayLabel').textContent=labelOf(gKey);$('#gNext').disabled=gKey>=dayKey(Date.now());
  $('#gBody').innerHTML='<div class="empty">読み込み中…</div>';
  const k=gKey,gid=curGroup.id;
  const clips=await fetchDay(k,members.length?members:[me.id]);
  if(k===gKey&&curGroup&&gid===curGroup.id)renderDay($('#gBody'),clips,names);
}
$('#gPrev').onclick=()=>{gKey=shiftKey(gKey,-1);renderGroupDay()};
$('#gNext').onclick=()=>{if(gKey<dayKey(Date.now())){gKey=shiftKey(gKey,1);renderGroupDay()}};

$('#createBtn').onclick=async()=>{
  const name=$('#newGroup').value.trim();if(!name){gmsg('グループ名を入れてください');return}
  const {data,error}=await sb.rpc('create_group',{gname:name});
  if(error){gmsg('作れませんでした');return}
  $('#newGroup').value='';gmsg(`「${data.name}」を作りました。招待コードを友達に送りましょう`,true);
  curGroup=data;await loadGroups();
};
$('#joinBtn').onclick=async()=>{
  const code=$('#joinCode').value.trim().toUpperCase();if(code.length!==6){gmsg('招待コードは6文字です');return}
  const {data,error}=await sb.rpc('join_group',{gcode:code});
  if(error){gmsg(/not_found/.test(error.message)?'そのコードのグループは見つかりません':/group_full/.test(error.message)?'このグループは満員です(20人まで)':'参加できませんでした');return}
  $('#joinCode').value='';gmsg(`「${data.name}」に参加しました`,true);
  if(joinFromUrl)history.replaceState(null,'',location.pathname);
  curGroup=data;await loadGroups();
};
$('#shareBtn').onclick=async()=>{
  if(!curGroup)return;
  const url=location.origin+location.pathname+'?join='+curGroup.code;
  const text=`スタログのグループ「${curGroup.name}」で一緒に勉強しよう!\n招待コード:${curGroup.code}\n${url}`;
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);gmsg('招待メッセージをコピーしました。LINEなどに貼り付けて送ってください',true)}
  catch(e){prompt('これをコピーして送ってください',text)}
};
$('#leaveBtn').onclick=async()=>{
  if(!curGroup||!confirm(`「${curGroup.name}」を抜けますか?`))return;
  await sb.from('group_members').delete().eq('group_id',curGroup.id).eq('user_id',me.id);
  curGroup=null;lsSet('sl_group',null);gmsg('グループを抜けました',true);loadGroups();
};

/* ---------- 1時間ごとのお知らせ ---------- */
let timer=null;
function scheduleRemind(){
  clearTimeout(timer);
  if(!$('#remind').checked)return;
  timer=setTimeout(()=>{
    $('#banner').style.display='block';
    try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('スタログ',{body:'いまの勉強を2秒撮りましょう'})}catch(e){}
    scheduleRemind();
  },60*60*1000);
}
$('#remind').checked=lsGet('sl_remind',false);
$('#remind').onchange=()=>{
  lsSet('sl_remind',$('#remind').checked);
  if($('#remind').checked&&'Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}
  scheduleRemind();
};

/* ---------- 開いたまま朝4時をまたいだら「今日」を切り替える ---------- */
let lastToday=dayKey(Date.now());
function rollDay(){
  const t=dayKey(Date.now());
  if(t===lastToday)return;
  if(mKey===lastToday)mKey=t;
  if(gKey===lastToday)gKey=t;
  lastToday=t;
  if(!me)return;
  if(!$('#pMine').classList.contains('hidden'))renderMine();
  if(!$('#pGroup').classList.contains('hidden')&&curGroup)renderGroupDay();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollDay()});
setInterval(rollDay,60e3);

/* ---------- 新しい版が出たら自動で切り替える ---------- */
// ホーム画面から開くと古いページが残りやすいので、開き直したときに確認する。
// 中身を変えたら APP_VERSION の値も必ず変える。
const APP_VERSION='2026-10-19a';
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(/const APP_VERSION='([^']+)'/);
    if(!m||m[1]===APP_VERSION)return;
    if(sessionStorage.getItem('sl_reloaded')===m[1])return;   // 何度も読み直さない
    sessionStorage.setItem('sl_reloaded',m[1]);
    const q=new URLSearchParams(location.search);q.set('v',m[1]);
    location.replace(location.pathname+'?'+q.toString());
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
window.addEventListener('pageshow',e=>{if(e.persisted)checkUpdate()});
checkUpdate();

renderSubjects();updateRecBtn();scheduleRemind();
</script>
</body>
</html>
